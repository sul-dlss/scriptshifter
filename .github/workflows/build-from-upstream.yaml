name: Build from Upstream Tag

on:
  workflow_dispatch:
    inputs:
      upstream_tag:
        description: "Upstream tag to build (e.g., v2.22.0)"
        required: true
        type: string

jobs:
  build-base:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    
    steps:
      - name: Checkout upstream at tag
        uses: actions/checkout@v6
        with:
          repository: lcnetdev/scriptshifter
          ref: ${{ inputs.upstream_tag }}

      - name: Checkout our custom Dockerfiles
        uses: actions/checkout@v6
        with:
          sparse-checkout: |
            scriptshifter_base.Dockerfile
          sparse-checkout-cone-mode: false
          path: custom

      - name: Copy custom Dockerfile
        run: |
          cp custom/scriptshifter_base.Dockerfile .

      - name: Extract version
        id: version
        run: |
          VERSION="${{ inputs.upstream_tag }}"
          VERSION="${VERSION#v}"  # Remove 'v' prefix
          echo "version=$VERSION" >> $GITHUB_OUTPUT

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.repository_owner }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push base image
        uses: docker/build-push-action@v7
        env:
          version: ${{ steps.version.outputs.version }}
        with:
          context: .
          file: ./scriptshifter_base.Dockerfile
          push: true
          tags: |
            ghcr.io/${{ github.repository_owner }}/scriptshifter-base:${{ env.version }}
            ghcr.io/${{ github.repository_owner }}/scriptshifter-base:latest
          cache-from: type=gha,scope=base
          cache-to: type=gha,mode=max,scope=base

      - name: Output base image
        run: |
          echo "### Base Image Built 🎉" >> $GITHUB_STEP_SUMMARY
          echo "**Upstream Tag:** ${{ inputs.upstream_tag }}" >> $GITHUB_STEP_SUMMARY
          echo "**Version:** ${{ steps.version.outputs.version }}" >> $GITHUB_STEP_SUMMARY
          echo "**Image:** ghcr.io/${{ github.repository_owner }}/scriptshifter-base:${{ steps.version.outputs.version }}" >> $GITHUB_STEP_SUMMARY

  build-app:
    runs-on: ubuntu-latest
    needs: build-base
    permissions:
      contents: read
      packages: write
    
    steps:
      - name: Checkout upstream at tag
        uses: actions/checkout@v6
        with:
          repository: lcnetdev/scriptshifter
          ref: ${{ inputs.upstream_tag }}

      - name: Checkout our custom Dockerfile
        uses: actions/checkout@v6
        with:
          sparse-checkout: |
            Dockerfile
          sparse-checkout-cone-mode: false
          path: custom

      - name: Copy custom Dockerfile
        run: |
          cp custom/Dockerfile .

      - name: Extract version
        id: version
        run: |
          VERSION="${{ inputs.upstream_tag }}"
          VERSION="${VERSION#v}"
          echo "version=$VERSION" >> $GITHUB_OUTPUT

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.repository_owner }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push app image
        uses: docker/build-push-action@v7
        env:
          version: ${{ steps.version.outputs.version }}
        with:
          context: .
          file: ./Dockerfile
          push: true
          tags: |
            ghcr.io/${{ github.repository_owner }}/scriptshifter:${{ env.version }}
            ghcr.io/${{ github.repository_owner }}/scriptshifter:latest
          cache-from: type=gha,scope=app
          cache-to: type=gha,mode=max,scope=app

      - name: Output app image
        run: |
          echo "### App Image Built 🚀" >> $GITHUB_STEP_SUMMARY
          echo "**Upstream Tag:** ${{ inputs.upstream_tag }}" >> $GITHUB_STEP_SUMMARY
          echo "**Version:** ${{ steps.version.outputs.version }}" >> $GITHUB_STEP_SUMMARY
          echo "**Image:** ghcr.io/${{ github.repository_owner }}/scriptshifter:${{ steps.version.outputs.version }}" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "### Update Kubernetes Manifest" >> $GITHUB_STEP_SUMMARY
          echo '```yaml' >> $GITHUB_STEP_SUMMARY
          echo "images:" >> $GITHUB_STEP_SUMMARY
          echo "  - name: scriptshifter" >> $GITHUB_STEP_SUMMARY
          echo "    newName: ghcr.io/$${{ github.repository_owner }}/scriptshifter" >> $$GITHUB_STEP_SUMMARY
          echo "    newTag: $${{ steps.version.outputs.version }}" >> $$GITHUB_STEP_SUMMARY
          echo '```' >> $GITHUB_STEP_SUMMARY