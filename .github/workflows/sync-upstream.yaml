name: Sync Upstream Tags

on:
  schedule:
    - cron: '0 0 * * 0' # Weekly on Sunday
  workflow_dispatch:  # Manual trigger

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          fetch-depth: 0
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Add upstream remote
        run: |
          git remote add upstream https://github.com/lcnetdev/scriptshifter.git
          git fetch upstream --tags

      - name: Push tags to origin
        run: |
          git push origin --tags --force

      - name: Sync main branch (optional)
        run: |
          git checkout main
          git merge upstream/main --no-edit || echo "No changes to merge"
          git push origin main